<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Daily Life</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e1220">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#0e1220;--pn:#171c2e;--pn2:#212843;--ln:#2a3250;--tx:#e8eaf2;--mu:#8a92ad;--dawn:#ffb36b;--dusk:#8f9bff;--ok:#6fd3a5;--bad:#ff7a8a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 "Bricolage Grotesque",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 16px 96px}
h1{font-size:30px;font-weight:800;margin:4px 0 2px;letter-spacing:-.5px}
h2{font-size:18px;margin:22px 0 10px}
p{margin:0}.mu,small{color:var(--mu)}small{display:block;font-size:13px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--dusk);outline-offset:2px}
.card,.row{background:var(--pn);border:1px solid var(--ln);border-radius:14px}
.card{padding:14px;margin:12px 0}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;margin:8px 0;min-height:58px}
.row .tx{flex:1;min-width:0}.row b{font-weight:600;display:block;overflow-wrap:anywhere}
.row.live{border-color:var(--dawn);background:#2a2436}.row.dim{opacity:.55}.row.done b{text-decoration:line-through;color:var(--mu)}
.ck{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--mu);background:none;position:relative}
.ck.on{background:var(--ok);border-color:var(--ok)}
.ck.on::after{content:"";position:absolute;left:8px;top:3px;width:7px;height:13px;border:solid #0e1220;border-width:0 3px 3px 0;transform:rotate(45deg)}
.x{flex:none;width:34px;height:34px;border-radius:10px;border:1px solid var(--ln);background:none;color:var(--bad);font-size:20px}
.b1,.b2{border:0;border-radius:12px;padding:12px 16px;font-weight:600;width:100%}
.b1{background:var(--dawn);color:#1b1305}.b2{background:var(--pn2)}
.arc{margin:16px 0}.bar{position:relative;height:16px;border-radius:8px;background:var(--pn2)}
.bar i{position:absolute;top:0;bottom:0}.bar .sch{background:#5b4a3b;border-radius:8px}
.bar .now{width:4px;margin-left:-2px;top:-5px;bottom:-5px;background:var(--dawn);border-radius:3px}
.tk{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin-top:8px}
.big{font-size:44px;font-weight:800;line-height:1;color:var(--dawn)}
.pb{height:8px;border-radius:6px;background:var(--pn2);overflow:hidden;margin:8px 0}.pb i{display:block;height:100%;background:var(--dusk)}
.days{display:flex;gap:6px;margin:8px 0}.days button{flex:1;padding:10px 0;border:1px solid var(--ln);border-radius:10px;background:var(--pn);font-size:13px}
.days .on{background:var(--dusk);color:#10142b;border-color:var(--dusk);font-weight:600}
.dots{display:flex;gap:6px;margin:10px 0}.dots span{flex:1;text-align:center;font-size:12px;padding:6px 0;border-radius:8px;background:var(--pn2);color:var(--mu)}.dots .y{background:var(--ok);color:#0e1220}
.top{display:flex;align-items:center;gap:8px;justify-content:space-between}.st{color:var(--dawn);font-size:14px;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal span{text-align:center;font-size:12px;color:var(--mu)}
.cal button{aspect-ratio:1;border:1px solid var(--ln);border-radius:10px;background:var(--pn)}
.cal .m{border-color:var(--dawn)}.cal .t{background:var(--dusk);color:#10142b;font-weight:700}.cal .s{outline:2px solid var(--ok)}
.nv{display:flex;justify-content:space-between;align-items:center;gap:8px}.nv button{width:44px;height:44px;border-radius:12px;border:1px solid var(--ln);background:var(--pn)}
nav{position:fixed;left:0;right:0;bottom:0;background:#11162a;border-top:1px solid var(--ln);display:flex;overflow-x:auto;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));gap:6px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;background:none;padding:10px 14px;border-radius:12px;color:var(--mu);font-size:14px}
nav .on{background:var(--pn2);color:var(--dawn);font-weight:600}
#dlg{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:9}#dlg[hidden]{display:none}
.sheet{background:var(--pn);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin-top:0}.sheet label{display:block;font-size:13px;color:var(--mu);margin:10px 0}
.sheet input{display:block;width:100%;margin-top:4px;padding:12px;font:inherit;font-size:16px;color:var(--tx);background:var(--pn2);border:1px solid var(--ln);border-radius:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
#toast{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));background:var(--dawn);color:#1b1305;padding:14px;border-radius:14px;font-weight:600;z-index:10}#toast[hidden]{display:none}
.sw{width:50px;height:30px;border-radius:16px;border:0;background:var(--pn2);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--mu)}
.sw.on{background:var(--dusk)}.sw.on::after{left:24px;background:#fff}
</style>
</head>
<body>
<main id="m"></main>
<nav id="nv" aria-label="Sections"></nav>
<div id="dlg" hidden></div>
<div id="toast" hidden role="alert"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0"),DF=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),HM=d=>pad(d.getHours())+":"+pad(d.getMinutes());
const mins=t=>{const[h,m]=t.split(":").map(Number);return h*60+m};
const t12=t=>{const[h,m]=t.split(":").map(Number);return(h%12||12)+(m?":"+pad(m):"")+(h<12?" AM":" PM")};
const DN=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const LU=["12:00","13:00","Lunch break","",""],AD=["08:00","09:00","Advisory meeting","RM. 104-A","Mr. Manatad"];
const SC=[
[AD,["09:00","12:00","NET 113","RM. 207","Mr. Larobis"],LU,["13:00","17:00","PLD 112","RM. 104-A","Mr. Paluca"]],
[AD,["09:00","11:00","PE 112 (gym)","GYM","Mr. Cabahug"],["11:00","12:00","MATH 113 activity","RM. 201",""],LU,["13:00","17:00","GD 112","RM. 104-B","Mr. Baclaan"]],
[AD,["09:00","11:00","MATH 113","RM. 206",""],["11:00","13:00","NET 113","RM. 207","Mr. Larobis"],["13:00","14:00","Lunch break","",""],["14:00","15:00","EMATH 113 activity","RM. 105","Mr. Dimaculangan"],["15:00","17:00","EMATH 113","RM. 105","Mr. Dimaculangan"]],
[AD,["09:00","10:00","CHEM 113 activity","RM. 210","Mr. Fernandez"],["10:00","12:00","CHEM 113 lecture","RM. 210","Mr. Fernandez"],LU,["13:00","14:00","BCD 111","RM. 211","Mr. Taborada"],["14:00","17:00","CHEM 111 lab","RM. 211","Mr. Fernandez"]],
[AD,["09:00","12:00","CSS 113","RM. 208","Mr. Manatad"],LU,["13:00","15:00","CSS 113","RM. 208","Mr. Manatad"],["15:00","17:00","PLD 112","RM. 104-A","Mr. Paluca"]],
[["09:00","12:00","NSTP 1","RM. 201","Mr. Marlon Valencia"]],[]];
const R=[["wake","05:35","Wake up"],["fresh","05:45","Wash up and stretch"],["bfast","06:15","Breakfast"],["ready","06:45","Get dressed and pack bag"],["leave","07:30","Leave for school"],["school","08:00","School (8 AM to 5 PM)"],["home","17:30","Arrive home and rest"],["dinner","18:30","Dinner"],["study","19:30","Homework and review"],["prep","21:15","Prepare bag and uniform"],["wind","22:00","Wind down, no screens"],["bed","22:30","Bedtime"]];
let S={};try{S=JSON.parse(localStorage.getItem("mdl"))||{}}catch(e){}
S=Object.assign({rd:{},todos:[],hw:[],ev:[],hist:{},
habits:["Drink water","Exercise","Read 20 minutes","Review lessons","Sleep on time"].map(n=>({n,log:[]})),
rem:[["Wake up!","05:35"],["Leave for school","07:30"],["Homework time","19:30"],["Wind down for bed","22:00"],["Bedtime, lights out","22:30"]].map(([n,t])=>({n,t,on:true,last:""}))},S);
const prog=()=>{const k=DF(new Date()),d=(S.rd[k]||[]).length,hw=S.hw.filter(h=>h.due===k||(h.due<k&&!h.done));
const r={routine:[d,R.length],todos:[S.todos.filter(t=>t.done).length,S.todos.length],homework:[hw.filter(h=>h.done).length,hw.length],habits:[S.habits.filter(h=>h.log.includes(k)).length,S.habits.length]};
const a=Object.values(r).reduce((s,v)=>s+v[0],0),b=Object.values(r).reduce((s,v)=>s+v[1],0);r.all=b?Math.round(100*a/b):0;return r};
const save=()=>{S.hist[DF(new Date())]=prog().all;try{localStorage.setItem("mdl",JSON.stringify(S))}catch(e){}};
const streak=l=>{let d=new Date(),n=0;if(!l.includes(DF(d)))d.setDate(d.getDate()-1);while(l.includes(DF(d))){n++;d.setDate(d.getDate()-1)}return n};
const cls=(hm,wd)=>{let c=null,x=null;for(const i of SC[wd]){if(i[0]<=hm&&hm<i[1])c=i;else if(i[0]>hm&&!x)x=i}return[c,x]};
const ck=(on,a,i)=>`<button class="ck${on?" on":""}" data-a="${a}" data-i="${i}" aria-pressed="${on}" aria-label="Toggle"></button>`;
const del=(a,i)=>`<button class="x" data-a="${a}" data-i="${i}" aria-label="Delete">×</button>`;
const row=(l,t,s,r,c="")=>`<div class="row ${c}">${l||""}<div class="tx"><b>${t}</b>${s?`<small>${s}</small>`:""}</div>${r||""}</div>`;
const add=(a,t)=>`<button class="b1" data-a="${a}">${t}</button>`;
let tab="today",cd=Math.min((new Date().getDay()+6)%7,5),cy=new Date().getFullYear(),cm=new Date().getMonth(),sel=DF(new Date());
const T=[["today","Today"],["classes","Classes"],["todo","To-do"],["hw","Homework"],["habits","Habits"],["prog","Progress"],["cal","Calendar"],["rem","Reminders"]];
const V={
today(){const n=new Date(),k=DF(n),wd=(n.getDay()+6)%7,p=prog(),hm=HM(n),dn=S.rd[k]||[],[c,x]=cls(hm,wd);
const pos=Math.max(0,Math.min(100,(mins(hm)-335)/10.15)),a=(480-335)/10.15,b=(1020-335)/10.15;
return`<h1>My Daily Life</h1><p class="mu">${n.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})}</p>
<div class="arc" aria-label="Your day from 5:35 AM to 10:30 PM"><div class="bar"><i class="sch" style="left:${a}%;width:${b-a}%"></i><i class="now" style="left:${pos}%"></i></div><div class="tk"><span>Wake 5:35 AM</span><span>School 8 AM to 5 PM</span><span>Bed 10:30 PM</span></div></div>
<div class="card"><div class="big">${p.all}%</div><div class="pb"><i style="width:${p.all}%"></i></div><small>of today’s plan is done</small></div>
<div class="card">${c?`<b>Now: ${esc(c[2])}</b><small>${t12(c[0])} to ${t12(c[1])} ${esc(c[3])} ${esc(c[4])}</small>`:`<b>No class right now</b>`}${x?`<small>Next: ${esc(x[2])} at ${t12(x[0])}</small>`:""}</div>
<h2>Daily routine</h2>${R.map(([i,t,nm])=>row(ck(dn.includes(i),"rt",i),nm,t12(t),"",dn.includes(i)?"done":"")).join("")}`},
classes(){const hm=HM(new Date()),td=(new Date().getDay()+6)%7===cd,L=SC[cd];
return`<h1>Class schedule</h1><p class="mu">Section 10</p><div class="days">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map((d,i)=>`<button class="${i===cd?"on":""}" data-a="day" data-i="${i}">${d}</button>`).join("")}</div>
<h2>${DN[cd]}</h2>${L.length?L.map(i=>{const lu=i[2].startsWith("Lunch");return row("",esc(i[2]),`${t12(i[0])} to ${t12(i[1])} ${esc(i[3])} ${esc(i[4])}`,"",(td&&i[0]<=hm&&hm<i[1]?"live ":"")+(lu?"dim":""))}).join(""):`<p class="mu">No classes. Rest day.</p>`}
<p class="mu" style="margin-top:14px">Saturday NSTP end time is not on your schedule, so 12 PM is assumed.</p>`},
todo(){const o=S.todos.map((t,i)=>[t,i]).sort((a,b)=>a[0].done-b[0].done);
return`<h1>To-do list</h1>${o.length?o.map(([t,i])=>row(ck(t.done,"td",i),esc(t.t),"",del("tx",i),t.done?"done":"")).join(""):`<p class="mu" style="margin:14px 0">No tasks yet. Add your first one.</p>`}${add("ta","Add task")}${S.todos.some(t=>t.done)?`<button class="b2" style="margin-top:10px" data-a="tc">Clear completed</button>`:""}`},
hw(){const k=DF(new Date()),o=S.hw.map((h,i)=>[h,i]).sort((a,b)=>a[0].done-b[0].done||a[0].due.localeCompare(b[0].due));
return`<h1>Homework</h1>${o.length?o.map(([h,i])=>{const s=h.done?"Done":h.due<k?"Overdue, was due "+h.due:h.due===k?"Due today":"Due "+h.due;return row(ck(h.done,"hd",i),esc(h.s+": "+h.t),`<span style="color:${!h.done&&h.due<k?"var(--bad)":!h.done&&h.due===k?"var(--dawn)":"var(--mu)"}">${s}</span>`,del("hx",i),h.done?"done":"")}).join(""):`<p class="mu" style="margin:14px 0">No homework. Enjoy the free time.</p>`}${add("ha","Add homework")}`},
habits(){const k=DF(new Date());return`<h1>Habit tracker</h1>${S.habits.map((h,i)=>{let d=[];for(let j=6;j>=0;j--){const x=new Date();x.setDate(x.getDate()-j);d.push(`<span class="${h.log.includes(DF(x))?"y":""}">${x.toLocaleDateString(undefined,{weekday:"short"})[0]}</span>`)}
const on=h.log.includes(k);return`<div class="card"><div class="top"><b>${esc(h.n)}</b><span class="st">${streak(h.log)}-day streak</span>${del("bx",i)}</div><div class="dots">${d.join("")}</div><button class="${on?"b2":"b1"}" data-a="bt" data-i="${i}">${on?"Done today. Tap to undo":"Mark done today"}</button></div>`}).join("")}${add("ba","Add habit")}`},
prog(){const p=prog(),n=[["Routine","routine"],["To-do","todos"],["Homework","homework"],["Habits","habits"]];let h="";
for(let j=6;j>=0;j--){const x=new Date();x.setDate(x.getDate()-j);const v=S.hist[DF(x)]||0;h+=`<small>${x.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}: ${v}%</small><div class="pb"><i style="width:${v}%"></i></div>`}
return`<h1>Daily progress</h1><div class="card"><div class="big">${p.all}%</div><small>completed today</small></div><div class="card">${n.map(([l,k])=>`<small>${l}: ${p[k][0]} of ${p[k][1]}</small><div class="pb"><i style="width:${p[k][1]?100*p[k][0]/p[k][1]:0}%"></i></div>`).join("")}</div><h2>Last 7 days</h2><div class="card">${h}</div>`},
cal(){const f=(new Date(cy,cm,1).getDay()+6)%7,dm=new Date(cy,cm+1,0).getDate(),k=DF(new Date()),mk=new Set([...S.hw.map(h=>h.due),...S.ev.map(e=>e.d)]);
let g="MTWTFSS".split("").map(d=>`<span>${d}</span>`).join("")+"<i></i>".repeat(f);
for(let d=1;d<=dm;d++){const s=cy+"-"+pad(cm+1)+"-"+pad(d);g+=`<button class="${mk.has(s)?"m ":""}${s===k?"t ":""}${s===sel?"s":""}" data-a="cs" data-i="${s}">${d}</button>`}
const wd=(new Date(sel+"T00:00").getDay()+6)%7,cl=SC[wd].filter(i=>!i[2].startsWith("Lunch"));
return`<h1>Calendar</h1><div class="nv"><button data-a="cp" aria-label="Previous month">‹</button><b>${new Date(cy,cm,1).toLocaleDateString(undefined,{month:"long",year:"numeric"})}</b><button data-a="cn" aria-label="Next month">›</button></div><div class="cal" style="margin-top:12px">${g}</div>
<h2>${new Date(sel+"T00:00").toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})}</h2>
${cl.map(i=>row("",esc(i[2]),`${t12(i[0])} to ${t12(i[1])} ${esc(i[3])}`)).join("")||`<p class="mu">No classes this day.</p>`}
${S.hw.filter(h=>h.due===sel).map(h=>row("",esc("Due: "+h.s+" "+h.t),h.done?"Done":"Pending")).join("")}
${S.ev.map((e,i)=>e.d===sel?row("",esc(e.t),"Event",del("ex",i)):"").join("")}<div style="margin-top:12px">${add("ea","Add event")}</div>`},
rem(){return`<h1>Reminders</h1>${S.rem.map((r,i)=>row("",esc(r.n),"Every day at "+t12(r.t),`<button class="sw${r.on?" on":""}" data-a="rs" data-i="${i}" aria-label="Turn on or off" aria-pressed="${r.on}"></button>${del("rx",i)}`)).join("")}${add("ra","Add reminder")}
<button class="b2" style="margin-top:10px" data-a="rn">Allow phone notifications</button><p class="mu" style="margin-top:12px;font-size:13px">Reminders ring at the set time while this page is open.</p>`}};
function render(){$("#m").innerHTML=V[tab]();$("#nv").innerHTML=T.map(([k,l])=>`<button class="${k===tab?"on":""}" data-a="go" data-i="${k}">${l}</button>`).join("");const a=$("#nv .on");a&&a.scrollIntoView({inline:"center",block:"nearest"})}
const up=()=>{save();render()};
let cb=null;
function ask(t,fs,fn){cb=fn;$("#dlg").innerHTML=`<form class="sheet"><h2>${t}</h2>${fs.map(([l,ty,v])=>`<label>${l}<input type="${ty}" value="${esc(v||"")}" required></label>`).join("")}<div class="two"><button type="button" class="b2" data-a="cx">Cancel</button><button class="b1">Save</button></div></form>`;$("#dlg").hidden=false;$("#dlg input").focus()}
const closeD=()=>{$("#dlg").hidden=true;cb=null};
document.addEventListener("submit",e=>{e.preventDefault();const v=[...e.target.querySelectorAll("input")].map(i=>i.value.trim());if(cb&&cb(v)!==false){closeD();up()}});
const tg=(a,x)=>{const i=a.indexOf(x);i<0?a.push(x):a.splice(i,1)};
const tm=new Date(Date.now()+864e5);
const H={go:i=>{tab=i;render();scrollTo(0,0)},cx:closeD,day:i=>{cd=+i;render()},
rt:i=>{tg(S.rd[DF(new Date())]=S.rd[DF(new Date())]||[],i);up()},
td:i=>{S.todos[i].done=!S.todos[i].done;up()},tx:i=>{S.todos.splice(i,1);up()},tc:()=>{S.todos=S.todos.filter(t=>!t.done);up()},
ta:()=>ask("New task",[["What do you need to do?","text"]],v=>{S.todos.push({t:v[0],done:false})}),
hd:i=>{S.hw[i].done=!S.hw[i].done;up()},hx:i=>{S.hw.splice(i,1);up()},
ha:()=>ask("New homework",[["Subject","text"],["Task","text"],["Due date","date",DF(tm)]],v=>{S.hw.push({s:v[0],t:v[1],due:v[2],done:false})}),
bt:i=>{tg(S.habits[i].log,DF(new Date()));up()},bx:i=>{S.habits.splice(i,1);up()},
ba:()=>ask("New habit",[["Habit name","text"]],v=>{S.habits.push({n:v[0],log:[]})}),
cp:()=>{cm--;if(cm<0){cm=11;cy--}render()},cn:()=>{cm++;if(cm>11){cm=0;cy++}render()},cs:i=>{sel=i;render()},
ea:()=>ask("New event",[["Event title","text"]],v=>{S.ev.push({d:sel,t:v[0]})}),ex:i=>{S.ev.splice(i,1);up()},
rs:i=>{S.rem[i].on=!S.rem[i].on;up()},rx:i=>{S.rem.splice(i,1);up()},
ra:()=>ask("New reminder",[["Title","text"],["Time","time","18:00"]],v=>{S.rem.push({n:v[0],t:v[1],on:true,last:""})}),
rn:()=>{try{Notification.requestPermission().then(p=>toast(p==="granted"?"Notifications allowed":"Notifications are blocked in this browser"))}catch(e){toast("Notifications aren’t supported here")}}};
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(t&&H[t.dataset.a])H[t.dataset.a](t.dataset.i)});
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,6000)}
function ring(n,m){toast(n+" at "+m);try{if(Notification.permission==="granted")new Notification(n,{body:m})}catch(e){}try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}
setInterval(()=>{const n=new Date(),h=HM(n),k=DF(n);let c=0;S.rem.forEach(r=>{if(r.on&&r.t===h&&r.last!==k){r.last=k;c=1;ring(r.n,t12(r.t))}});if(c)save();if(tab==="today"&&$("#dlg").hidden&&!c)render()},15000);
save();render();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
